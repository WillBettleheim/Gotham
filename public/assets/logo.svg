<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72" role="img" aria-label="Gotham crest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset="0.6" stop-color="#3b2a7a"/>
      <stop offset="1" stop-color="#6b3fa0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.45" stop-color="#f2b843"/>
      <stop offset="1" stop-color="#b9771b"/>
    </linearGradient>
    <linearGradient id="town" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14112b"/>
      <stop offset="1" stop-color="#0b0918"/>
    </linearGradient>
    <clipPath id="shield"><path d="M32 4 L58 12 V36 C58 52 46 63 32 68 C18 63 6 52 6 36 V12 Z"/></clipPath>
  </defs>
  <!-- shield -->
  <path d="M32 1.5 L60.5 10.2 V36 C60.5 53.5 47.5 65.5 32 70.5 C16.5 65.5 3.5 53.5 3.5 36 V10.2 Z" fill="url(#gold)"/>
  <path d="M32 4 L58 12 V36 C58 52 46 63 32 68 C18 63 6 52 6 36 V12 Z" fill="url(#sky)"/>
  <g clip-path="url(#shield)">
    <!-- moon and stars -->
    <circle cx="46" cy="18" r="6" fill="#fff2c4"/>
    <circle cx="48.6" cy="16.2" r="5.2" fill="#2d2266"/>
    <g fill="#fff6d8">
      <rect x="15" y="15" width="1.6" height="1.6"/><rect x="22" y="10" width="1.2" height="1.2"/>
      <rect x="38" y="25" width="1.2" height="1.2"/><rect x="12" y="25" width="1.2" height="1.2"/>
      <path d="M53 27 l.8 1.8 1.8 .8 -1.8 .8 -.8 1.8 -.8 -1.8 -1.8 -.8 1.8 -.8z"/>
    </g>
    <!-- skyline: two gabled houses and the clock tower -->
    <path d="M6 70 V44 L15 36 L24 44 V50 L26 50 V30 L32 21 L38 30 V50 L40 50 V44 L49 36 L58 44 V70 Z" fill="url(#town)"/>
    <!-- tower clock -->
    <circle cx="32" cy="35" r="4.2" fill="url(#gold)"/>
    <circle cx="32" cy="35" r="3.1" fill="#fff6dc"/>
    <path d="M32 35 V32.6 M32 35 L33.8 35.9" stroke="#2a1b10" stroke-width=".8" stroke-linecap="round"/>
    <!-- lit windows -->
    <g fill="#ffcf5a">
      <rect x="12" y="46" width="2.4" height="3"/><rect x="16" y="46" width="2.4" height="3"/>
      <rect x="45.6" y="46" width="2.4" height="3"/><rect x="49.6" y="46" width="2.4" height="3"/>
      <rect x="30.6" y="43" width="2.8" height="4"/><rect x="28.4" y="50" width="2" height="2.6"/><rect x="33.6" y="50" width="2" height="2.6"/>
      <path d="M30 70 V57 a2 2 0 0 1 4 0 V70 Z"/>
    </g>
    <!-- river -->
    <path d="M6 61 C14 58 20 64 32 61 C44 58 50 64 58 61 V70 H6 Z" fill="#3e7fd0" opacity=".9"/>
    <path d="M10 63 C16 61.5 20 64.5 26 63 M38 63.5 C44 62 48 65 54 63.5" stroke="#bfe3ff" stroke-width=".9" fill="none" stroke-linecap="round"/>
  </g>
  <!-- inner rim highlight -->
  <path d="M32 4 L58 12 V36 C58 52 46 63 32 68 C18 63 6 52 6 36 V12 Z" fill="none" stroke="#ffe7a3" stroke-opacity=".55" stroke-width=".8"/>
</svg>
